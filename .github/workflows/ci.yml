name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build-test:
    name: build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      # Package versions are pinned and updated by hand, so a known vulnerability in any direct or
      # transitive package fails the build. Fix it with a pinned upgrade in Directory.Packages.props.
      - name: Audit for vulnerable packages
        run: |
          set -o pipefail
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable-packages.txt
          if grep -q "has the following vulnerable packages" vulnerable-packages.txt; then
            echo "::error::Known-vulnerable NuGet packages found (see the list above)"
            exit 1
          fi

      - name: Format check
        run: dotnet format --verify-no-changes --no-restore

      - name: Build (warnings are errors)
        run: dotnet build --no-restore --configuration Release

      # Testcontainers pulls through the Docker API with a 100 s HTTP timeout; the Oracle and Presidio images
      # can take longer than that on a fresh runner, so they are pulled up front, in parallel.
      - name: Pre-pull integration test images
        run: |
          docker pull postgres:17-alpine &
          docker pull gvenzl/oracle-free:23-slim-faststart &
          docker pull mcr.microsoft.com/presidio-analyzer:2.2.362 &
          wait

      # Unit + FsCheck property tests, then integration tests that start postgres:17-alpine,
      # gvenzl/oracle-free:23-slim-faststart and the Presidio analyzer through Testcontainers.
      - name: Test
        run: >
          dotnet test --no-build --configuration Release
          --coverage --coverage-output-format cobertura
          --results-directory "${{ github.workspace }}/TestResults"

      - name: Coverage summary
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@5.5.12
        with:
          reports: TestResults/**/*.cobertura.xml
          targetdir: coverage
          reporttypes: MarkdownSummaryGithub
          assemblyfilters: "-*Tests*;-*Benchmarks*;-guarded-db-demo"
          filefilters: "-*/obj/*"

      - name: Publish coverage to job summary
        if: always()
        run: |
          if [ -f coverage/SummaryGithub.md ]; then
            cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No coverage report produced."
          fi

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: TestResults/
          retention-days: 7

  pack:
    name: pack .NET tool
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Pack
        run: dotnet pack src/GuardedDbMcp.Server/GuardedDbMcp.Server.csproj --configuration Release --output artifacts

      # The package must install as a tool and start: the usage path exits 2 without touching a database.
      - name: Install and smoke-test the tool
        run: |
          unzip -l artifacts/GuardedDbMcp.*.nupkg | grep -E "\.mcp/server\.json|README\.md|tools/net10\.0/any/guarded-db-mcp\.dll"
          dotnet tool install GuardedDbMcp --tool-path ./tool --add-source ./artifacts --version 1.0.0
          set +e
          ./tool/guarded-db-mcp nonsense-command
          test $? -eq 2

      - uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: artifacts/*.nupkg
          retention-days: 30

  container:
    name: container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: guarded-db-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the image runs as non-root
        run: |
          user=$(docker image inspect guarded-db-mcp:ci --format '{{.Config.User}}')
          echo "Configured user: ${user}"
          test -n "${user}" && test "${user}" != "0" && test "${user}" != "root"

  compose-demo:
    name: docker compose demo
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      # The README promises `docker compose up` runs the whole demo with zero manual steps; this job keeps it true.
      - name: Start the stack
        run: docker compose up -d --build

      - name: Scripted agent passes every scenario and the audit chain verifies
        run: |
          test "$(docker wait guarded-db-mcp-agent-1)" = "0" || { docker compose logs agent mcp; exit 1; }
          docker compose logs agent | tee agent.log
          grep -q "DEMO_OK postgres" agent.log
          grep -q "audit chain OK" agent.log
          curl -fsS http://localhost:18080/health

      - name: The endpoint refuses requests without the bearer key
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:18080/mcp -H 'Content-Type: application/json' -d '{}')
          test "$code" = "401"

      - name: Logs on failure
        if: failure()
        run: docker compose logs
